<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>海上搜救协调</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1100px;margin:30px auto;padding:0 20px;color:#17324d}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{border:1px solid #cbd8e3;padding:8px;text-align:left}th{background:#edf5fb}code{background:#f2f5f7;padding:2px 5px}.card{background:#f7fbfe;border-left:5px solid #2784c7;padding:12px 16px}.pending_review{color:#a35b00}.stale{color:#b3261e}</style>
<h1>海上搜救协调</h1><div class="card">页面读取实时状态。业务写入通过 README 中的 JSON API 完成，并需要 <code>X-User</code>、<code>X-Role</code>。</div>
<h2>遇险事件</h2><table id="incidents"><thead><tr><th>编号</th><th>船名</th><th>状态</th><th>海况</th><th>负责机构</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>资源</h2><table id="assets"><thead><tr><th>名称</th><th>类型</th><th>状态</th><th>航程</th></tr></thead><tbody></tbody></table>
<h2>搜索区域</h2><table id="areas"><thead><tr><th>编号</th><th>事件</th><th>状态</th><th>优先级</th><th>资源</th><th>已扫测%</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>对账复核</h2><table id="recon"><thead><tr><th>记录</th><th>区域</th><th>状态</th><th>差异原因（记录值→当前值）</th></tr></thead><tbody></tbody></table>
<h2>离线批次</h2><table id="batches"><thead><tr><th>批次</th><th>状态</th><th>接收</th><th>失败</th><th>重复</th><th>接收时间</th></tr></thead><tbody></tbody></table>
<h2>时间线</h2><ol id="timeline"></ol>
<script>async function load(){const d=await fetch('/api/state').then(r=>r.json());const fill=(id,rows,cols)=>{document.querySelector('#'+id+' tbody').innerHTML=rows.map(r=>'<tr>'+cols.map(c=>`<td>${r[c]??''}</td>`).join('')+'</tr>').join('')};fill('incidents',d.incidents,['code','vessel_name','status','sea_state','lead_org','version']);fill('assets',d.assets,['name','kind','status','range_km']);fill('areas',d.search_areas,['code','incident_id','status','priority','assigned_asset_id','swept_pct','version']);document.querySelector('#recon tbody').innerHTML=d.recon_items.map(x=>{const rs=(x.reasons||[]).map(r=>`${r.message}（${r.recorded??'—'}→${r.current??'—'}）`).join('；');return `<tr><td>${x.client_event_id}</td><td>${x.area_id??''}</td><td class="${x.status}">${x.status}</td><td>${rs}</td></tr>`}).join('');document.querySelector('#batches tbody').innerHTML=d.offline_batches.map(b=>{const s=b.summary||{};return `<tr><td>${b.client_batch_id}</td><td>${b.status}</td><td>${s.accepted??0}</td><td>${s.failed??s.rejected??0}</td><td>${s.duplicates??0}</td><td>${b.received_at}</td></tr>`}).join('');document.querySelector('#timeline').innerHTML=d.timeline.slice(0,20).map(x=>`<li>${x.created_at} ${x.action} ${x.details}</li>`).join('')}load()</script></html>
