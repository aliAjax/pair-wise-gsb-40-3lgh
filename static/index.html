<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>海上搜救协调</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1100px;margin:30px auto;padding:0 20px;color:#17324d}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{border:1px solid #cbd8e3;padding:8px;text-align:left}th{background:#edf5fb}code{background:#f2f5f7;padding:2px 5px}.card{background:#f7fbfe;border-left:5px solid #2784c7;padding:12px 16px}.pending{color:#a35b00;font-weight:600}</style>
<h1>海上搜救协调</h1><div class="card">页面读取实时状态。业务写入通过 README 中的 JSON API 完成，并需要 <code>X-User</code>、<code>X-Role</code>。</div>
<h2>遇险事件</h2><table id="incidents"><thead><tr><th>编号</th><th>船名</th><th>状态</th><th>海况</th><th>负责机构</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>资源</h2><table id="assets"><thead><tr><th>名称</th><th>类型</th><th>状态</th><th>航程</th></tr></thead><tbody></tbody></table>
<h2>搜索区域</h2><table id="areas"><thead><tr><th>编号</th><th>事件</th><th>状态</th><th>优先级</th><th>资源</th></tr></thead><tbody></tbody></table>
<h2>回传对账</h2><div class="card" id="recon-summary"></div><table id="recon"><thead><tr><th>记录</th><th>区域</th><th>区域版本(现场/当前)</th><th>状态</th><th>差异原因(现场值 → 当前值)</th></tr></thead><tbody></tbody></table>
<h2>时间线</h2><ol id="timeline"></ol>
<script>
const fill=(id,rows,cols)=>{document.querySelector('#'+id+' tbody').innerHTML=rows.map(r=>'<tr>'+cols.map(c=>`<td>${r[c]??''}</td>`).join('')+'</tr>').join('')};
async function load(){
  const d=await fetch('/api/state').then(r=>r.json());
  fill('incidents',d.incidents,['code','vessel_name','status','sea_state','lead_org','version']);
  fill('assets',d.assets,['name','kind','status','range_km']);
  fill('areas',d.search_areas,['code','incident_id','status','priority','assigned_asset_id']);
  document.querySelector('#timeline').innerHTML=d.timeline.slice(0,20).map(x=>`<li>${x.created_at} ${x.action} ${x.details}</li>`).join('');
  const rc=await fetch('/api/recon/status').then(r=>r.json());
  const s=rc.summary;
  document.querySelector('#recon-summary').textContent=`待复核 ${s.pending_review||0} · 已并入 ${s.merged||0} · 已确认 ${s.confirmed||0} · 已排除 ${s.dismissed||0} · 失效结论 ${s.stale_conclusions||0} · 历史线索 ${rc.legacy.clues.length} 条(已并入)`;
  document.querySelector('#recon tbody').innerHTML=rc.records.map(r=>{
    const reasons=r.diff_reasons.map(x=>`${x.message}（现场 ${JSON.stringify(x.field_value)} → 当前 ${JSON.stringify(x.current_value)}）`).join('<br>');
    return `<tr><td>${r.client_event_id}</td><td>${r.area_code??r.area_id??''}</td><td>${r.area_version_seen}/${r.current_area_version??'-'}</td><td class="${r.recon_status==='pending_review'?'pending':''}">${r.recon_status}</td><td>${reasons}</td></tr>`;
  }).join('');
}
load()
</script></html>
